{% load i18n %}
<form action="{% url 'set_language' %}" method="post" class="app-lang">
  {% csrf_token %}
  <input name="next" type="hidden" value="{{ request.get_full_path }}">
  <label for="lang-select" class="sr-only">{% trans "Language" %}</label>
  <select id="lang-select" name="language" class="form-select form-select-sm" onchange="this.form.submit()">
    {% get_current_language as LANGUAGE_CODE %}
    {% get_available_languages as LANGUAGES %}
    {% for code, name in LANGUAGES %}
      <option value="{{ code }}" {% if code == LANGUAGE_CODE %}selected{% endif %}>{{ name }}</option>
    {% endfor %}
  </select>
</form>
